      itemId: coins
      count: 10
    - !<unlockSkillReward>
      skillId: skill_two_handed
    - !<unlockSkillReward>
      skillId: skill_ranged
    - !<unlockSkillReward>
      skillId: skill_defense
    - !<unlockSkillReward>
