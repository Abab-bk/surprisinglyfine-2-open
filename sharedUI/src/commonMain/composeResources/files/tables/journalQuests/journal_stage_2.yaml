      skillId: skill_smithing

- id: quest_stage_2_3
  name: 整装待发
  conditions:
    - !<itemCollected>
      itemId: copper_sword
      need: 1
    - !<itemCollected>
      itemId: copper_boots
      need: 1
    - !<itemCollected>
      itemId: copper_leg_armor
      need: 1
    - !<itemCollected>
      itemId: copper_shield
      need: 1
