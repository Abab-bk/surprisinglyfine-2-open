- id: quest_stage_2_1
  name: 想吃点鱼
  conditions:
    - !<itemCollected>
      itemId: carp
      need: 5
  rewards:
    - !<itemReward>
      itemId: coins
      count: 10
    - !<unlockSkillReward>
      skillId: skill_cooking

- id: quest_stage_2_2
  name: 想吃点鱼2
  conditions:
    - !<itemCollected>
      itemId: carp_cook
      need: 1
  rewards:
