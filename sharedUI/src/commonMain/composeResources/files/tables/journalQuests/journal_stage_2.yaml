      itemId: copper_armor
      need: 1
  rewards:
    - !<itemReward>
      itemId: coins
      count: 10
    - !<unlockSkillReward>
      skillId: skill_one_handed

- id: quest_stage_2_4
  name: Battle!
  conditions:
    - !<enemyKilled>
      enemyId: slash_carb_1
